<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEURALUX — Interactive SaaS Preview</title>
<link rel="stylesheet" href="./styles.css">
<style>
.previewbar{position:fixed;z-index:99;top:12px;left:50%;transform:translateX(-50%);padding:9px 15px;border:1px solid #2b3040;background:#0c0f16ee;border-radius:999px;color:#aeb5c5;font-size:11px;white-space:nowrap}
.previewbar b{color:#b29dff}
</style>
</head>
<body>
<div class="previewbar"><b>NEURALUX</b> · Interactive SaaS Preview</div>
<div id="root"></div>
<script>
const root=document.getElementById('root');
const state={tab:'overview',signedIn:false,prompt:'',result:''};
const generations=[
'Create a launch strategy for an AI productivity app',
'Write a premium landing page structure',
'Analyze my SaaS growth idea'
];
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
function btn(txt,cls,fn){const b=el('button',cls,txt);b.type='button';b.addEventListener('click',fn);return b;}
function login(){
 root.replaceChildren();const wrap=el('div','auth'),card=el('div','authCard');
 card.append(el('div','brand','N ✦ NEURALUX'),el('h1','','Build with intelligence.'),el('p','muted','Interactive product preview — demo account'));
 const form=el('form');const email=el('input');email.placeholder='Email';email.type='email';email.value='alex@example.com';
 const pass=el('input');pass.placeholder='Password';pass.type='password';pass.value='demo12345';
 const enter=el('button','primary','Enter workspace →');enter.type='submit';form.append(email,pass,enter);
 form.addEventListener('submit',e=>{e.preventDefault();state.signedIn=true;render();});
 card.append(form,btn('Continue with demo account','switch',()=>{state.signedIn=true;render();}));wrap.append(card);root.append(wrap);
}
function sidebar(){
 const aside=el('aside');aside.append(el('div','brand','N ✦'));
 const nav=el('div','sideNav');
 [['overview','⌂','Overview'],['studio','✦','AI Studio'],['billing','◈','Billing']].forEach(([id,icon,label])=>{
  const b=btn(icon+' '+label,state.tab===id?'active':'',()=>{state.tab=id;render();});nav.append(b);
 });
 aside.append(nav);const bottom=el('div','sideBottom'),mini=el('div','planMini');
 mini.append(el('small','','CURRENT PLAN'),el('b','','PRO'));const meter=el('div','meter'),fill=el('i');fill.style.width='82%';meter.append(fill);mini.append(meter,el('small','','4,270 credits'));
 bottom.append(mini,btn('↪ Sign out','',()=>{state.signedIn=false;login();}));aside.append(bottom);return aside;
}
function header(title){const h=el('header'),left=el('div');left.append(el('div','eyebrow','AI OPERATING SYSTEM'),el('h2','',title));h.append(left,el('div','avatar','A'));return h;}
function overview(main){
 const section=el('section'),hero=el('div','hero'),copy=el('div');
 copy.append(el('div','pill','● SYSTEM ONLINE'),el('h1','','Turn ideas into intelligence.'),el('p','','One workspace for AI generation, usage intelligence and scalable automation.'),btn('Open AI Studio →','primary',()=>{state.tab='studio';render();}));
 const orb=el('div','orb');orb.append(el('div','orbCore','✦'),el('div','ring r1'),el('div','ring r2'),el('div','ring r3'));hero.append(copy,orb);section.append(hero);
 const stats=el('div','stats');[['AI CREDITS','4,270','available'],['GENERATIONS','128','all time'],['PLAN','PRO','active']].forEach(a=>{const d=el('div');d.append(el('small','',a[0]),el('strong','',a[1]),el('span','',a[2]));stats.append(d);});section.append(stats);
 const panel=el('div','panel'),ph=el('div','panelHead');ph.append(el('b','','Recent generations'),el('span','','DEMO'));panel.append(ph);
 generations.forEach(g=>{const row=el('div','history'),ico=el('div','historyIcon','✦'),desc=el('div');desc.append(el('b','',g),el('p','','Demo output with structured recommendations and next steps…'));row.append(ico,desc,el('time','','Today'));panel.append(row);});section.append(panel);main.append(section);
}
function studio(main){
 const section=el('section','studio'),top=el('div','studioTop'),left=el('div');
 left.append(el('div','eyebrow','NEURAL ENGINE'),el('h1','','What will you create?'),el('p','','Describe a task, idea, strategy or piece of content.'));
 top.append(left,el('div','creditBadge','✦ 4,270 credits'));section.append(top);
 const area=el('textarea');area.placeholder='e.g. Build a launch strategy for an AI productivity app…';area.value=state.prompt;area.addEventListener('input',e=>state.prompt=e.target.value);section.append(area);
 section.append(btn('Generate intelligence →','primary generate',()=>{if(!state.prompt.trim()){area.focus();return;}state.result='NEURALUX DEMO RESPONSE\\n\\nI analyzed your request: “'+state.prompt+'”\\n\\nSuggested output:\\n• Clear objective\\n• Structured execution plan\\n• Measurable next step\\n\\nThis is sample preview output. Connect a real AI provider for live model responses.';render();}));
 if(state.result){const box=el('div','result'),head=el('div','resultHead');head.append(el('span','','✦ OUTPUT'),btn('Copy','',()=>navigator.clipboard&&navigator.clipboard.writeText(state.result)));box.append(head,el('pre','',state.result));section.append(box);}
 main.append(section);
}
function billing(main){
 const section=el('section','billing'),top=el('div','studioTop'),left=el('div');
 left.append(el('div','eyebrow','SUBSCRIPTIONS'),el('h1','','Scale your intelligence.'),el('p','','Choose the capacity your workflow needs.'));top.append(left);section.append(top);
 const plans=el('div','plans');
 [['Free','$0','100',['Core workspace','Usage dashboard']],['Pro','$29','5,000',['Priority generation','Advanced analytics']],['Scale','$99','25,000',['Higher limits','Priority support','Advanced controls']]].forEach(p=>{
  const card=el('div','plan '+(p[0]==='Pro'?'current':''));card.append(el('div','planTag',p[0]==='Pro'?'CURRENT':''),el('h3','',p[0]),el('div','price',p[1]));card.lastChild.append(el('small','','/mo'));card.append(el('b','',p[2]+' credits'));p[3].forEach(f=>card.append(el('div','feature','✓ '+f)));card.append(btn(p[0]==='Pro'?'Current plan':'Preview plan','primary',()=>alert('This is a preview. Live subscription checkout is not connected.')));plans.append(card);
 });section.append(plans);main.append(section);
}
function render(){
 root.replaceChildren();if(!state.signedIn){login();return;}
 const app=el('div','app'),main=el('main');app.append(sidebar());main.append(header(state.tab==='overview'?'Good to see you, Alex':state.tab==='studio'?'AI Studio':'Plans & billing'));
 if(state.tab==='overview')overview(main);if(state.tab==='studio')studio(main);if(state.tab==='billing')billing(main);app.append(main);root.append(app);
}
render();
</script>
</body></html>

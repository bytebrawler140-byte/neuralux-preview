<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEURALUX — Interactive Preview</title><link rel="stylesheet" href="styles.css">
<style>.previewbar{position:fixed;z-index:99;top:14px;left:50%;transform:translateX(-50%);padding:9px 15px;border:1px solid #2b3040;background:#0c0f16ee;backdrop-filter:blur(12px);border-radius:999px;color:#aeb5c5;font-size:11px}.previewbar b{color:#b29dff}</style>
</head><body><div class="previewbar"><b>NEURALUX</b>&nbsp; Interactive SaaS Preview</div><div id="root"></div>
<script type="module">
import React,{useState} from "https://esm.sh/react@18.3.1";
import {createRoot} from "https://esm.sh/react-dom@18.3.1/client";
const U={name:"Alex Morgan",plan:"pro",credits:4270};
const history=["Create a launch strategy for an AI productivity app","Write a premium landing page structure","Analyze my SaaS growth idea"];
function Login({go}){return <div className="auth"><div className="authCard"><div className="brand">N<span>✦</span> NEURALUX</div><h1>Build with intelligence.</h1><p className="muted">Interactive product preview.</p><form onSubmit={e=>{e.preventDefault();go()}}><input placeholder="Email" defaultValue="alex@example.com"/><input placeholder="Password" type="password" defaultValue="password123"/><button className="primary">Enter workspace →</button></form><button className="switch" onClick={go}>Continue with demo account</button></div></div>}
function App(){const [ok,setOk]=useState(false),[tab,setTab]=useState("overview"),[prompt,setPrompt]=useState(""),[out,setOut]=useState("");if(!ok)return <Login go={()=>setOk(true)}/>;return <div className="app"><aside><div className="brand">N<span>✦</span></div><div className="sideNav">{[["overview","⌂","Overview"],["studio","✦","AI Studio"],["billing","◈","Billing"]].map(x=><button className={tab===x[0]?"active":""} onClick={()=>setTab(x[0])}>{x[1]} <span>{x[2]}</span></button>)}</div><div className="sideBottom"><div className="planMini"><small>CURRENT PLAN</small><b>PRO</b><div className="meter"><i style={{width:"82%"}}/></div><small>4,270 credits</small></div><button onClick={()=>setOk(false)}>↪ Sign out</button></div></aside><main><header><div><div className="eyebrow">AI OPERATING SYSTEM</div><h2>{tab==="overview"?"Good to see you, Alex":tab==="studio"?"AI Studio":"Plans & billing"}</h2></div><div className="avatar">A</div></header>
{tab==="overview"&&<section><div className="hero"><div><div className="pill">● SYSTEM ONLINE</div><h1>Turn ideas into<br/><em>intelligence.</em></h1><p>One workspace for AI generation, usage intelligence and scalable automation.</p><button className="primary" onClick={()=>setTab("studio")}>Open AI Studio →</button></div><div className="orb"><div className="orbCore">✦</div><div className="ring r1"/><div className="ring r2"/><div className="ring r3"/></div></div><div className="stats"><div><small>AI CREDITS</small><strong>4,270</strong><span>available</span></div><div><small>GENERATIONS</small><strong>128</strong><span>all time</span></div><div><small>PLAN</small><strong>PRO</strong><span>active</span></div></div><div className="panel"><div className="panelHead"><b>Recent generations</b><span>LIVE</span></div>{history.map((x,i)=><div className="history"><div className="historyIcon">✦</div><div><b>{x}</b><p>AI result generated with structured recommendations and next steps…</p></div><time>Today</time></div>)}</div></section>}
{tab==="studio"&&<section className="studio"><div className="studioTop"><div><div className="eyebrow">NEURAL ENGINE</div><h1>What will you create?</h1><p>Describe a task, idea, strategy or piece of content.</p></div><div className="creditBadge">✦ 4,270 credits</div></div><textarea value={prompt} onChange={e=>setPrompt(e.target.value)} placeholder="e.g. Build a launch strategy for an AI productivity app…"/><button className="primary generate" onClick={()=>setOut("NEURALUX demo response:\n\nI analyzed your request: \""+prompt+"\"\n\nSuggested output:\n• Clear objective\n• Structured execution plan\n• Measurable next step")}>Generate intelligence →</button>{out&&<div className="result"><div className="resultHead"><span>✦ OUTPUT</span><button onClick={()=>navigator.clipboard?.writeText(out)}>Copy</button></div><pre>{out}</pre></div>}</section>}
{tab==="billing"&&<section className="billing"><div className="studioTop"><div><div className="eyebrow">SUBSCRIPTIONS</div><h1>Scale your intelligence.</h1><p>Choose the capacity your workflow needs.</p></div></div><div className="plans">{[["Free","$0","100"],["Pro","$29","5,000"],["Scale","$99","25,000"]].map(p=><div className={"plan "+(p[0]==="Pro"?"current":"")}><div className="planTag">{p[0]==="Pro"?"CURRENT":""}</div><h3>{p[0]}</h3><div className="price">{p[1]}<small>/mo</small></div><b>{p[2]} credits</b><div className="feature">✓ AI generation</div><div className="feature">✓ Usage analytics</div><div className="feature">✓ Priority workspace</div><button className={p[0]==="Pro"?"disabled":"primary"}>{p[0]==="Pro"?"Current plan":"Upgrade →"}</button></div>)}</div></section>}</main></div>}
createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
